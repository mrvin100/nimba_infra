# Full containerized stack for Nimba: web (Next.js) + app (Spring Boot) + postgres +
# minio (+ mailpit for local/staging use). This is the "run everything in Docker,
# like production" path.
#
# It is a DIFFERENT tool than app/docker-compose.yml: that file only starts the
# infrastructure (postgres, minio, mailpit) so the backend can run natively with
# `./gradlew bootRun` during day-to-day development. This file additionally builds
# and runs the app and web containers themselves, so the whole platform can be
# launched with one command the same way it would run on a server. Do not run both
# compose files at the same time — they claim the same host ports by default.
#
# Usage (from this infra/ directory):
#   cp .env.example .env      # then edit secrets/URLs for your environment
#   docker compose build
#   docker compose up -d
#
# See README.md for the full walkthrough.
name: nimba-stack

services:
  postgres:
    image: postgres:18 # latest stable PostgreSQL major (>= 16 required, NIMBA-5)
    container_name: nimba-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    # PostgreSQL 18 images store data in a major-version subdirectory, so the volume
    # is mounted at /var/lib/postgresql (NOT /var/lib/postgresql/data).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  minio:
    image: minio/minio:latest
    container_name: nimba-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - default

  # One-shot job: creates the app's bucket on first boot, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: nimba-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET};
      mc anonymous set none local/${MINIO_BUCKET};
      exit 0;"
    networks:
      - default

  # Local SMTP catch-all so invitation e-mails can be inspected without a real relay.
  # Only started with `--profile dev`; staging/production use MAIL_TRANSPORT=resend
  # instead (see .env.example), so this container is not part of the default stack.
  mailpit:
    image: axllent/mailpit:latest
    container_name: nimba-mailpit
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      # SMTP port is the SAME MAIL_PORT the app dials, so the relay this container
      # exposes and the relay the app connects to cannot drift.
      - "${MAIL_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - default

  app:
    build:
      context: ../app
      dockerfile: Dockerfile
    container_name: nimba-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Pass every variable in infra/.env straight through. This matters: a var that
    # is commented out (e.g. DATABASE_URL) must stay ABSENT from the container's
    # environment so Spring's own `${VAR:default}` placeholder can compute its
    # fallback. Listing a key directly under `environment:` with a shell
    # `${VAR:-}` substitution — even to represent "unset" — instead sets it to an
    # EMPTY STRING in the container, and Spring treats "present but empty"
    # differently from "absent": it uses the empty value, not the default. That
    # bug is what broke the datasource URL here before; env_file avoids the whole
    # class of it by only ever setting what infra/.env actually defines.
    env_file:
      - .env
    environment:
      # Overrides for values that must point at in-network service names/ports
      # rather than the host-mapped ones (or an internal container path). Keep
      # this list to ONLY genuinely network/topology-specific values — everything
      # else passes through from .env unchanged via env_file above.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MINIO_ENDPOINT: http://minio:9000
      AMORTIZATION_SCHEDULE_STORAGE_DIR: /app/storage/credit-cases
      LOG_FILE: /app/logs/nimba.log
    volumes:
      # Persist uploaded CSV audit files and rotated logs across restarts/redeploys.
      - app-storage:/app/storage
      - app-logs:/app/logs
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - default

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        # Baked into the client bundle at build time (see web/Dockerfile).
        NEXT_PUBLIC_API_BASE_PATH: ${API_BASE_PATH:-/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: nimba-web
    restart: unless-stopped
    environment:
      # Server-side only, read at runtime by next.config.ts's rewrites() — the
      # browser never calls this directly, it calls `web` same-origin at /api/*.
      BACKEND_ORIGIN: http://app:8080
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - default

volumes:
  pgdata:
  miniodata:
  app-storage:
  app-logs:

networks:
  default:
    name: nimba-network
    driver: bridge
